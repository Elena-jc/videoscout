# VideoScout default configuration. Override any field from the CLI with
#   --set agent.max_tool_calls=8 --set retrieval.use_bm25=false

models:
  # One model per role. Opus 5.5 everywhere by default; captioning is a bulk
  # offline job, so it is the first place to consider a cheaper model.
  planner: claude-opus-5-5
  verifier: claude-opus-5-5
  vision: claude-opus-5-5
  captioner: claude-opus-5-5
  planner_effort: medium
  verifier_effort: medium
  vision_effort: low
  captioner_effort: low
  max_tokens: 16000
  # Server-side refusal fallback (beta server-side-fallback-2026-07-01, fallbacks: "default").
  use_fallbacks: true
  # Local safety caps per day (videoscout/spend.py); 0 = no cap. Claude is paid per token.
  daily_request_limit: 300
  daily_cost_limit_usd: 3.0

index:
  segment_seconds: 10.0      # clip length: the retrieval unit ("chunk size" for video)
  keyframe_every: 2.0        # SigLIP keyframe spacing inside a clip
  track_fps: 2.0             # frames per second fed to the detector + tracker
  yolo_weights: yolo26s.pt   # YOLO26: cheap always-on tier (COCO classes, NMS-free); n/s/m/l/x
  yolo_conf: 0.3
  tracker: bytetrack.yaml    # or botsort.yaml (camera-motion compensation)
  # Frame-level embeddings (SigLIP 2). Kept as the ablation baseline for clip embeddings;
  # set to "" to skip. On CPU only, use google/siglip2-base-patch16-224.
  siglip_model: google/siglip2-so400m-patch14-384
  # Clip-level multimodal embeddings (Qwen3-VL-Embedding, 2026): a clip's frames and its
  # text in one vector. "" to skip.
  clip_embedder: Qwen/Qwen3-VL-Embedding-2B
  clip_frames: 4             # thumbnails per clip (embedding, captions, reranking)
  # Clip captions + event summaries + storyline (the text memory):
  #   local = Qwen3-VL-2B on this GPU (free), llm = the API captioner role, none
  captioner: local
  captioner_model: Qwen/Qwen3-VL-2B-Instruct
  caption_mode: batch        # llm captioner only: batch (Batches API, 50% cheaper) | sync
  event_min_seconds: 20.0    # events: runs of clips cut where the content changes
  event_max_seconds: 180.0
  device: auto               # auto | cpu | cuda

retrieval:
  use_dense: true
  dense: auto                # auto (clip if indexed, else keyframe) | clip | keyframe
  use_bm25: true
  rrf_k: 60
  candidate_pool: 40
  rerank: true               # Qwen3-VL-Reranker cross-encoder over the fused top candidates
  reranker_model: Qwen/Qwen3-VL-Reranker-2B
  rerank_top_n: 20
  rerank_frames: 3
  mmr_lambda: 0.7
  mmr_tau_seconds: 30.0

grounding:
  # find_objects at question time. SAM 3 tracks every instance of a noun phrase through
  # the window (identities kept); its weights are gated (request access to facebook/sam3
  # on Hugging Face, put HF_TOKEN in .env, download once). Until then YOLOE-26 is used:
  # per-frame open-vocabulary boxes from text prompts.
  backend: auto              # auto | sam3 | yoloe
  sam3_model: facebook/sam3
  sam3_max_frames: 32
  weights: yoloe-26s-seg.pt  # YOLOE; "" disables the YOLOE fallback
  conf: 0.25
  max_frames: 16
  default_frames: 8

agent:
  tools: inprocess           # inprocess | mcp
  disabled_tools: ""         # comma-separated, for ablations, e.g. "query_tracks"
  strict_tools: true
  max_tool_calls: 12
  max_frames: 48
  max_frames_per_inspect: 8
  default_frames_per_inspect: 6
  verify: true
  max_verify_rounds: 2
  confidence_threshold: 0.6
  max_llm_turns: 20

# USD per 1M tokens, used to report cost per question.
pricing:
  claude-opus-5-5: {input: 4.0, output: 20.0, cache_write: 5.0, cache_read: 0.20}
  claude-opus-4-8: {input: 5.0, output: 25.0, cache_write: 6.25, cache_read: 0.50}
  claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.20}
  claude-haiku-4-5: {input: 1.0, output: 5.0, cache_write: 1.25, cache_read: 0.10}
