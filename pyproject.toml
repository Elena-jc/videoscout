[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videoscout"
version = "0.1.0"
description = "A tool-using agent that answers questions about long videos with coarse-to-fine evidence search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    # local web app (all three already come with the MCP SDK)
    "starlette>=0.40",
    "uvicorn>=0.30",
    "sse-starlette>=2.0",
    "langgraph>=0.4",
    "mcp>=2.2",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10",
    "pyyaml>=6",
]

[project.scripts]
videoscout = "videoscout.cli:main"

[project.optional-dependencies]
# Offline indexing: detection + tracking + SigLIP embeddings. torch is installed separately
# (CPU or CUDA build, see README).
index = [
    "ultralytics>=8.4",
    "lap>=0.5",
    # text encoder tokenizer for YOLOE open-vocabulary prompts
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "ftfy>=6",
    # Qwen3-VL (embedder, reranker, captioner) and SAM 3 need transformers 5
    "transformers>=5.0",
    "sentence-transformers>=5.1",
    "accelerate>=1.0",
    "qwen-vl-utils>=0.0.14",
    "sentencepiece>=0.2",
    "protobuf>=4",
]
eval = ["pandas>=2", "pyarrow>=15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["videoscout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs model weights (YOLO11n, SigLIP) and runs real indexing"]
